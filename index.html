function pgDashboard() {
  const pub=!cu;  // คนทั่วไป (ไม่ login) เห็นเฉพาะภาพรวม ซ่อนงบ/ชื่อช่าง
  const tickets=DB.tickets.filter(t=>t.status!=='cancelled');  // ไม่นับใบที่ยกเลิก
  const active=tickets.filter(t=>!CLOSED_STATUS.includes(t.status));
  const done=tickets.filter(t=>t.status==='done');
  const pending=tickets.filter(t=>t.status==='pending_approval');
  const overSLA=active.filter(t=>isOverSLA(t));
  // ความพึงพอใจเฉลี่ย (จากงานที่ให้คะแนนแล้ว)
  const rated=tickets.filter(t=>t.rating&&t.rating>0);
  const avgRating=rated.length?(rated.reduce((s,t)=>s+t.rating,0)/rated.length):0;
  const budgetData=BUILDINGS.map(b=>{
    const bt=tickets.filter(t=>t.building===b.id);
    const spent=bt.reduce((s,t)=>s+(t.actualCost||0),0);
    return{...b,spent,pct:Math.min(100,Math.round(spent/b.budget*100))};
  });
  const totalBudget=BUILDINGS.reduce((s,b)=>s+b.budget,0);
  const totalSpent=budgetData.reduce((s,b)=>s+b.spent,0);
  const hotspot=BUILDINGS.map(b=>({...b,count:tickets.filter(t=>t.building===b.id).length,active:tickets.filter(t=>t.building===b.id&&!CLOSED_STATUS.includes(t.status)).length}));
  const maxHs=Math.max(...hotspot.map(h=>h.count),1);
  // v12: เฉพาะคนที่รับงานซ่อมได้ (บริหารไม่ขึ้น) + วิศวกรมีภาระงานบริหารจัดการแยกป้าย
  const pmDueN=(PM_LIST||[]).filter(p=>{const s=pmDue(p);return s&&s.due;}).length;
  const techLoad=assignableEntries().map(([u,v2])=>{
    const tw=tickets.filter(t=>(t.assignees||[]).includes(u));
    const own=tw.filter(t=>!CLOSED_STATUS.includes(t.status)).length;
    const r={u,v:v2,own,active:own,done:tw.filter(t=>t.status==='done').length,overSla:tw.filter(t=>isOverSLA(t)).length,adm:null};
    if(v2.isEngineer){
      const mine=tickets.filter(t=>t.approvedBy===u);
      r.adm={pending:pending.length, assigned:mine.length, oversee:mine.filter(t=>!CLOSED_STATUS.includes(t.status)).length, pm:pmDueN};
      r.active=own+r.adm.pending+r.adm.oversee+r.adm.pm;
    }
    return r;
  });
  const maxLoad=Math.max(...techLoad.map(t=>t.active),1);
  const catData=CATS.map(c=>({name:c,count:tickets.filter(t=>t.category===c).length})).sort((a,b)=>b.count-a.count);
  const maxCat=Math.max(...catData.map(c=>c.count),1);
  const recurring=[];
  BUILDINGS.forEach(b=>{CATS.forEach(c=>{const cnt=tickets.filter(t=>t.building===b.id&&t.category===c).length;if(cnt>=2)recurring.push({building:b,cat:c,count:cnt});});});
  recurring.sort((a,b)=>b.count-a.count);

  // สัดส่วนตามสถานะ (สำหรับ donut chart)
  const statusColorMap={pending_approval:'#e0a94b',assigned:'#8b6ff0',survey:'#e0a94b',purchase:'#8b6ff0',working:'#3ba7d6',insurance:'#22c19a',contractor:'#22c19a',done:'#5cc93f',cannot:'#e35b5b',cancelled:'#a8a08a'};
  const statusCounts=STATUSES.map(s=>({...s,count:tickets.filter(t=>t.status===s.id).length,color:statusColorMap[s.id]||'#888'})).filter(s=>s.count>0);
  const totalForDonut=statusCounts.reduce((a,s)=>a+s.count,0)||1;

  return `<div>
    ${pub?`<div class="notice n-info" style="margin-bottom:1rem"><i class="ti ti-info-circle ni"></i><div>ภาพรวมสถิติการแจ้งซ่อม (ข้อมูลสาธารณะ) — เจ้าหน้าที่เข้าสู่ระบบเพื่อดูงบประมาณและรายละเอียดเพิ่มเติม</div></div>`:''}
    <div class="g5 dash-stats" style="margin-bottom:1rem">
      <div class="stat stat-grad-a"><div class="stat-ic">📋</div><div class="stat-lbl">งานทั้งหมด</div><div class="stat-n">${tickets.length}</div></div>
      <div class="stat stat-grad-b"><div class="stat-ic">🔧</div><div class="stat-lbl">กำลังดำเนินการ</div><div class="stat-n">${active.length}</div><div class="stat-sub">รออนุมัติ ${pending.length}</div></div>
      <div class="stat stat-grad-c"><div class="stat-ic">✅</div><div class="stat-lbl">เสร็จสิ้น</div><div class="stat-n">${done.length}</div><div class="stat-sub">${tickets.length?Math.round(done.length/tickets.length*100):0}%</div></div>
      <div class="stat stat-grad-e"><div class="stat-ic">⭐</div><div class="stat-lbl">พึงพอใจเฉลี่ย</div><div class="stat-n">${avgRating?avgRating.toFixed(1):'—'}</div><div class="stat-sub">${rated.length?'จาก '+rated.length+' ความเห็น · ผู้แจ้ง '+rated.filter(t=>!t.ratedBy).length+' / แทน '+rated.filter(t=>t.ratedBy).length:'ยังไม่มีคะแนน'}</div></div>
      <div class="stat stat-grad-d"><div class="stat-ic">⏰</div><div class="stat-lbl">เกิน SLA</div><div class="stat-n">${overSLA.length}</div></div>
    </div>
    ${statusCounts.length?`<div class="card" style="margin-bottom:1rem">
      <div class="ctitle">🍩 สัดส่วนงานตามสถานะ</div>
      <div class="donut-wrap">
        ${donutSVG(statusCounts,totalForDonut)}
        <div class="donut-legend">
          ${statusCounts.map(s=>`<div class="donut-leg-item">
            <span class="donut-dot" style="background:${s.color}"></span>
            <span class="donut-leg-lbl">${s.label}</span>
            <span class="donut-leg-val">${s.count} <span style="color:var(--tx3)">(${Math.round(s.count/totalForDonut*100)}%)</span></span>
          </div>`).join('')}
        </div>
      </div>
    </div>`:''}
    ${pub?'':lowStockCard()}
    ${pub?'':kpiCard()}
    ${pub?'':carbonCard()}
    ${monthlyTrendCard(tickets)}
    ${pub?'':hotspotCard()}
    <div class="${pub?'':'g2'}" style="margin-bottom:1rem">
      ${pub?'':`<div class="card">
        <div class="ctitle">💰 งบประมาณรายอาคาร</div>
        <div class="stat" style="margin-bottom:.75rem">
          <div class="stat-lbl">ใช้จ่ายรวม</div>
          <div class="stat-n">${totalSpent.toLocaleString()} <span style="font-size:14px;font-weight:400;color:var(--tx2)">/ ${totalBudget.toLocaleString()} บาท</span></div>
          <div style="height:6px;background:var(--surf3);border-radius:3px;margin-top:8px">
            <div style="height:100%;border-radius:3px;background:${totalSpent/totalBudget>.8?'#e35b5b':'#5cc93f'};width:${Math.min(100,Math.round(totalSpent/totalBudget*100))}%"></div>
          </div>
        </div>
        <div class="bar-wrap">${budgetData.map(b=>`<div class="bar-row">
          <div class="bar-lbl">${b.icon} ${b.short}</div>
          <div><div class="bar-track"><div class="bar-fill" style="width:${b.pct}%;background:${b.pct>80?'#e35b5b':b.pct>50?'#e0a94b':'#5cc93f'}"></div></div>
          <div style="font-size:10px;color:var(--tx3);margin-top:2px">${b.spent.toLocaleString()} / ${b.budget.toLocaleString()} บาท</div></div>
          <div class="bar-val">${b.pct}%</div>
        </div>`).join('')}</div>
      </div>`}
      <div class="card">
        <div class="ctitle">🔥 Hotspot รายอาคาร</div>
        <div class="hs-grid" style="margin-bottom:.75rem">${hotspot.map(h=>{
          const pct=Math.round(h.count/maxHs*100),col=pct>75?'#e35b5b':pct>50?'#e0a94b':pct>25?'#3ba7d6':'#5cc93f';
          return `<div class="hs-card"><div class="hs-icon">${h.icon}</div><div class="hs-name">${h.short}</div>
            <div class="hs-count" style="color:${col}">${h.count}</div>
            <div class="hs-bar" style="background:${col}33"><div style="height:100%;border-radius:2px;background:${col};width:${pct}%"></div></div>
            <div style="font-size:11px;color:var(--tx3)">คงค้าง ${h.active}</div></div>`;
        }).join('')}</div>
        ${recurring.length?`<div style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px">ปัญหาซ้ำซาก</div>${recurring.slice(0,3).map(r=>`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:.5px solid var(--bd);font-size:12px"><span>${r.building.icon} ${r.building.short} — ${r.cat}</span><span class="badge b-red">${r.count} ครั้ง</span></div>`).join('')}`:''}
      </div>
    </div>
    <div class="${pub?'':'g2'}">
      ${pub?'':`<div class="card">
        <div class="ctitle">👷 ภาระงานแต่ละคน</div>
        ${techLoad.map(t=>{
          const pct=maxLoad?Math.round(t.active/maxLoad*100):0,wlColor=pct>80?'#e35b5b':pct>50?'#e0a94b':'#5cc93f';
          return `<div class="tech-card">
            <div class="tech-av" style="background:${t.v.color}33;color:${t.v.color}">${t.v.initials}</div>
            <div class="tech-info">
              <div class="tech-name">${t.v.name}</div>
              <div style="font-size:11px;color:var(--tx3)">${(t.v.specialty||[]).join(' · ')}</div>
              <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">
                <span class="badge b-blue">งานซ่อมคงค้าง ${t.own}</span>

              </div>
              ${t.adm?`<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px" title="ภาระงานบริหารจัดการ">
                <span class="badge b-amber">รออนุมัติ ${t.adm.pending}</span>
                <span class="badge b-purple">มอบหมายแล้ว ${t.adm.assigned}</span>
                <span class="badge b-teal">กำกับดูแล ${t.adm.oversee}</span>
                <span class="badge b-gray">PM ถึงรอบ ${t.adm.pm}</span>

            </div>

          </div>`;
        }).join('')}
      </div>`}
      <div class="card">
        <div class="ctitle">📊 งานแยกตามประเภท</div>
        <div class="bar-wrap">${catData.map(c=>{const pct=Math.round(c.count/maxCat*100);return `<div class="bar-row"><div class="bar-lbl">${c.name.replace('งาน','').replace('ระบบ','')}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:#3ba7d6"></div></div><div class="bar-val">${c.count}</div></div>`;}).join('')}</div>

        <div style="font-size:13px;font-weight:600;margin-bottom:6px">ภาระงานรายอาคาร</div>
        ${hotspot.map(h=>{const ratio=tickets.length?Math.round(h.count/tickets.length*100):0,cls=ratio>35?'b-red':ratio>20?'b-amber':'b-green',msg=ratio>35?'ภาระสูง':ratio>20?'ปานกลาง':'ต่ำ';
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:.5px solid var(--bd);font-size:12px"><span>${h.icon} ${h.name}</span><span class="badge ${cls}">${ratio}% — ${msg}</span></div>`;
        }).join('')}
      </div>
    </div>
  </div>`;
}

let roleDraft=null;
function ensureRoleDraft(){ if(!roleDraft) roleDraft=JSON.parse(JSON.stringify(ROLES.length?ROLES:[])); return roleDraft; }
function renderRoleMatrix(){
  const roles=ensureRoleDraft();
  if(!roles.length) return '<div style="color:var(--tx3);font-size:13px">ยังไม่มีข้อมูลบทบาท (จะถูกสร้างอัตโนมัติเมื่อเชื่อมต่อเซิร์ฟเวอร์)</div>';

const _photoLoading = {};
async function ensurePhotos(id){
  if (PHOTOS[id] !== undefined || _photoLoading[id] || !GAS_URL) return;

  _photoLoading[id] = true;

let pendingPhotos = [];   // รูปที่เลือกไว้ในฟอร์มแจ้งซ่อม (ยังไม่ส่ง)

function thumbUrl(fileId){ return 'https://drive.google.com/thumbnail?id='+fileId+'&sz=w400'; }

// ย่อรูปก่อนส่ง เพื่อลดขนาดไฟล์และเวลาอัปโหลด
function resizeImage(file, maxSide=1600, quality=0.82){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error('อ่านไฟล์ไม่สำเร็จ'));
    reader.onload=e=>{
      const img=new Image();
      img.onerror=()=>reject(new Error('ไฟล์รูปไม่ถูกต้อง'));
      img.onload=()=>{
        let {width:w,height:h}=img;
        if(Math.max(w,h)>maxSide){
          if(w>h){ h=Math.round(h*maxSide/w); w=maxSide; }
          else   { w=Math.round(w*maxSide/h); h=maxSide; }
        }
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        const durl=c.toDataURL('image/jpeg',quality);
        resolve({ dataUrl:durl, base64:durl.split(',')[1], mimeType:'image/jpeg' });
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// เลือกรูปในฟอร์มแจ้งซ่อม
async function onPickReportPhotos(input){
  const files=[...input.files];

  for(const f of files){
    if(pendingPhotos.length>=MAX_PHOTOS){ showToast('แนบได้สูงสุด '+MAX_PHOTOS+' รูป'); break; }
    if(!f.type.startsWith('image/')){ showToast('รองรับเฉพาะไฟล์รูปภาพ'); continue; }
    try{
      const r=await resizeImage(f);
      pendingPhotos.push(r);
    }catch(e){ showToast('ไม่สามารถอ่านรูปได้: '+e.message); }
  }
  renderPendingPhotos();
}

// ส่งรูปที่แนบไว้ขึ้นเซิร์ฟเวอร์
async function uploadPendingPhotos(ticketId, by, kind='report'){
  if(!GAS_URL || !pendingPhotos.length) return 0;
  // ส่งทุกรูปพร้อมกัน (ขนานกัน) แทนการรอทีละรูป
  const results = await Promise.all(pendingPhotos.map(p=>
    api('uploadPhoto',{photo:{ticketId,data:p.base64,mimeType:p.mimeType,kind,by:by||'ผู้แจ้ง'}})
      .catch(e=>{ console.warn('upload photo failed',e); return null; })
  ));
  let n=0;
  results.forEach(r=>{
    if(r && r.fileId){
      if(!PHOTOS[ticketId]) PHOTOS[ticketId]=[];
      PHOTO_COUNTS[ticketId]=(PHOTO_COUNTS[ticketId]||0)+1; PHOTOS[ticketId].push({fileId:r.fileId,kind:r.kind,name:r.name,by:by||'ผู้แจ้ง',at:new Date().toISOString()});
      n++;
    }
  });
  return n;
}

// ช่าง/วิศวกรแนบรูปเพิ่มในหน้ารายละเอียด
async function onAddTicketPhoto(input, ticketId, kind){
  const files=[...input.files].filter(f=>f.type.startsWith('image/')); input.value='';
  if(!files.length) return;
  if(!GAS_URL){ showToast('ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์'); return; }
  showLoader('กำลังอัปโหลดรูป...');
  // ย่อขนาดทุกรูปพร้อมกัน แล้วอัปโหลดพร้อมกัน
  let n=0, errMsg='';
  try{
    const resized=await Promise.all(files.map(f=>resizeImage(f).catch(()=>null)));
    const results=await Promise.all(resized.map(r=>
      r ? api('uploadPhoto',{photo:{ticketId,data:r.base64,mimeType:r.mimeType,kind,by:cu?cu.name:'-'}}).catch(e=>({error:e.message})) : null
    ));
    results.forEach(res=>{
      if(res && res.fileId){
        if(!PHOTOS[ticketId]) PHOTOS[ticketId]=[];
        PHOTO_COUNTS[ticketId]=(PHOTO_COUNTS[ticketId]||0)+1; PHOTOS[ticketId].push({fileId:res.fileId,kind:res.kind,name:res.name,by:cu?cu.name:'-',at:new Date().toISOString()});
        n++;
      } else if(res && res.error){ errMsg=res.error; }
    });
  }catch(e){ errMsg=e.message; }
  hideLoader();
  if(n){ showToast('อัปโหลด '+n+' รูปแล้ว'); openDet(ticketId); }
  else if(errMsg){ showToast('อัปโหลดไม่สำเร็จ: '+errMsg); }
}

async function removeTicketPhoto(ticketId, fileId){
  if(!cu||!cu.isEngineer){ showToast('เฉพาะวิศวกรเท่านั้นที่ลบรูปได้'); return; }
  if(!confirm('ลบรูปนี้?')) return;
  showLoader('กำลังลบ...');
  try{
    await api('deletePhoto',{fileId,token:AUTH_TOKEN});
    PHOTOS[ticketId]=(PHOTOS[ticketId]||[]).filter(p=>p.fileId!==fileId); PHOTO_COUNTS[ticketId]=PHOTOS[ticketId].length;

  }catch(e){ hideLoader(); if(!handleAuthError(e)) showToast('ลบไม่สำเร็จ: '+e.message); }
}

  }
  const flow=['pending_approval','assigned','survey','purchase','working','done'];
  const short={pending_approval:'รออนุมัติ',assigned:'มอบหมาย',survey:'สำรวจ',purchase:'จัดซื้อ',working:'ซ่อม',done:'เสร็จ'};
  const ci=flow.indexOf(cur);
  return `<div class="pipe">${flow.map((st,i)=>{
    const cls=i<ci?'done':i===ci?'now':'';

    return `<div class="pipe-step">

      <div class="pipe-lbl ${i===ci?'act':''}">${short[st]}</div>
    </div>`;
  }).join('')}</div><div style="height:1px;background:var(--bd);margin:0 0 1rem"></div>`;
}

function escAttr(s){return (s||'').replace(/"/g,'&quot;');}
function escHtml(s){return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function saveEdit(id){
  const t=DB.tickets.find(t=>t.id===id); if(!t) return;
  const fields={
    name:v('edN'), phone:v('edP'), dept:v('edD'), email:v('edE'),
    building:document.getElementById('edB').value, room:v('edR'),
    category:document.getElementById('edC').value, priority:document.getElementById('edPr').value,
    estimatedCost:parseFloat(document.getElementById('edCost').value)||0, desc:v('edDesc')
  };
  Object.assign(t, fields);
  const entry={status:t.status,date:now(),note:`วิศวกรแก้ไขข้อมูลใบแจ้งซ่อม`,by:cu.name};
  if(!t.history)t.history=[]; t.history.push(entry);
  await syncUpdate(id, fields, entry);
  hideLoader(); cm('editMd'); rp();
  showToast('บันทึกการแก้ไขแล้ว');
}

async function cancelTicket(id){
  if(!cu||!cu.isEngineer){ showToast('เฉพาะวิศวกรเท่านั้นที่ยกเลิกได้'); return; }
  const reason=prompt('เหตุผลที่ยกเลิกใบแจ้งซ่อมนี้:'); if(reason===null) return;
  const t=DB.tickets.find(t=>t.id===id); if(!t) return;
  t.status='cancelled';
  const entry={status:'cancelled',date:now(),note:'ยกเลิกใบแจ้ง: '+(reason||'-'),by:cu.name};
  if(!t.history)t.history=[]; t.history.push(entry);
  await syncUpdate(id,{status:'cancelled'},entry);
  hideLoader(); cm('detMd'); updApvCnt(); rp();
  showToast('ยกเลิกใบแจ้งซ่อมแล้ว');
}

// Timeline แนวนอน — จุดแต่ละสถานะ + ระยะเวลาที่ค้างในแต่ละขั้น (หาคอขวด)
function horizontalTimeline(t){
  const hist=(t.history||[]).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(hist.length<1) return '';
  const now=Date.now();
  const segs=hist.map((h,i)=>{
    const start=new Date(h.date).getTime();
    const end = i<hist.length-1 ? new Date(hist[i+1].date).getTime() : (CLOSED_STATUS.includes(t.status)?start:now);
    const days=Math.max(0,Math.round((end-start)/86400000));
    const si=getSI(h.status);
    const isLast=i===hist.length-1;
    const colorMap={pending_approval:'#e0a94b',assigned:'#8b6ff0',survey:'#e0a94b',purchase:'#8b6ff0',working:'#3ba7d6',insurance:'#22c19a',contractor:'#22c19a',done:'#5cc93f',cannot:'#e35b5b',cancelled:'#a8a08a'};
    const col=colorMap[h.status]||'#888';
    // ค้างนานผิดปกติ (>7 วันในขั้นที่ยังไม่จบ) = เตือน
    const stuck = days>=7 && !CLOSED_STATUS.includes(h.status);
    return {label:si.label,days,col,isLast,stuck,ongoing:isLast&&!CLOSED_STATUS.includes(t.status)};
  });
  return `<div style="font-size:12px;font-weight:600;color:var(--tx3);margin:4px 0 10px">เส้นทางการดำเนินงาน</div>
  <div class="htl">
    ${segs.map((s,i)=>`<div class="htl-seg">
      <div class="htl-node" style="background:${s.col}${s.ongoing?';box-shadow:0 0 0 4px '+s.col+'33;animation:htlPulse 1.6s ease-in-out infinite':''}"></div>
      ${i<segs.length-1?`<div class="htl-line" style="background:linear-gradient(90deg,${s.col},${segs[i+1].col})"></div>`:''}
      <div class="htl-lbl">${s.label}</div>
      <div class="htl-days ${s.stuck?'htl-stuck':''}">${s.ongoing?'กำลังอยู่ขั้นนี้ ':''}${s.days} วัน${s.stuck?' ⚠️':''}</div>
    </div>`).join('')}
  </div>
  <div style="height:12px"></div>`;
}

// ─── ความพึงพอใจหลังปิดงาน (ดาว 1-5) ───
let pendingRating=0;
function starSVG(filled){
  return `<svg viewBox="0 0 24 24" width="28" height="28" style="display:block"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.7 1.4 6.8L12 17.8 5.9 20.5l1.4-6.8L2.2 9l6.9-.7z" fill="${filled?'#f2b50c':'none'}" stroke="#f2b50c" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}
function ratingBlock(t){
  // แสดงเฉพาะงานที่เสร็จแล้ว
  if(t.status!=='done') return '';
  // ให้คะแนนแล้ว → โชว์ผล
  if(t.rating && t.rating>0){
    return `<div class="rate-box rated">
      <div style="font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:6px">⭐ ความพึงพอใจ${t.ratedBy?` <span class="badge b-purple nodot" style="font-size:10.5px">ประเมินแทนโดย ${escHtml(t.ratedBy)}</span>`:'ของผู้แจ้ง'}</div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="display:flex;gap:2px">${[1,2,3,4,5].map(i=>`<span style="opacity:${i<=t.rating?1:.25}">${starSVG(i<=t.rating)}</span>`).join('')}</div>
        <span style="font-weight:700;font-size:16px;color:var(--gold)">${t.rating}.0</span>
      </div>
      ${t.ratingComment?`<div style="font-size:13px;color:var(--tx2);margin-top:8px;background:var(--surf2);border-radius:8px;padding:.6rem .8rem">“${escHtml(t.ratingComment)}”</div>`:''}
    </div>`;
  }
  // ยังไม่ให้คะแนน → ฟอร์มให้ดาว (ใครก็ให้ได้ ไม่ต้อง login)
  pendingRating=0;
  const proxyOk = rateState(t)==='proxy';
  const dAt=doneAtOf(t), left=dAt?Math.max(0,Math.ceil((dAt.getTime()+RATE_PROXY_DAYS*86400000-Date.now())/86400000)):0;
  return `<div class="rate-box" id="rateForm">
    <div style="font-size:13px;font-weight:600;margin-bottom:4px">งานนี้เสร็จแล้ว — ให้คะแนนความพึงพอใจ</div>
    <div style="font-size:12px;color:var(--tx3);margin-bottom:8px">ความเห็นของท่านช่วยให้เราพัฒนาบริการ (ให้คะแนนได้ครั้งเดียว)</div>
    <div class="notice ${proxyOk?'n-amber':'n-info'}" style="margin:0 0 10px;font-size:12px;padding:.55rem .75rem"><i class="ti ti-info-circle ni"></i><div>
      ${proxyOk?`<b>เกิน ${RATE_PROXY_DAYS} วันแล้วยังไม่มีการประเมิน</b> — ผู้เกี่ยวข้องหรือผู้ปฏิบัติงานในชั้นนั้น (${escHtml(ticketFloor(t)||getBI(t.building).short)}) ประเมินแทนได้ เช่น งานที่ช่างหรือแม่บ้านแจ้งเอง หรือผู้แจ้งไม่สะดวกประเมิน`
      :`หมายเหตุ: หากผู้แจ้งไม่ประเมินภายใน ${RATE_PROXY_DAYS} วัน${left?` (อีก ${left} วัน)`:''} ผู้เกี่ยวข้องหรือผู้ปฏิบัติงานในชั้นนั้นจะประเมินแทนได้ เช่น งานที่ช่างหรือแม่บ้านแจ้งเอง`}
    </div></div>
    <div class="star-row" id="starRow">${[1,2,3,4,5].map(i=>`<button type="button" class="star-btn" data-v="${i}" onclick="setStars(${i})" onmouseover="hoverStars(${i})" onmouseout="hoverStars(0)">${starSVG(false)}</button>`).join('')}</div>
    <textarea id="rateComment" placeholder="ความเห็นเพิ่มเติม (ไม่บังคับ)" style="margin-top:10px;min-height:60px"></textarea>
    ${proxyOk?`<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;margin-top:8px;cursor:pointer"><input type="checkbox" id="rateProxy" style="width:auto" onchange="document.getElementById('rateProxyName').style.display=this.checked?'block':'none'"> ประเมินแทนผู้แจ้ง</label>
    <input id="rateProxyName" placeholder="ชื่อ-นามสกุล ผู้ประเมินแทน (เช่น ผู้ปฏิบัติงานชั้นนั้น)" style="display:none;margin-top:6px" value="${cu?escAttr(cu.name):''}">`:''}
    <div id="rateMsg" style="margin:8px 0"></div>
    <button class="btn btn-accent btn-sm" onclick="submitRating('${t.id}')"><i class="ti ti-send"></i> ส่งคะแนน</button>
  </div>`;
}
function paintStars(n){
  document.querySelectorAll('#starRow .star-btn').forEach(b=>{
    const v=+b.dataset.v;
    b.innerHTML=starSVG(v<=n);
  });
}
function hoverStars(n){ paintStars(n||pendingRating); }
function setStars(n){ pendingRating=n; paintStars(n); }
async function submitRating(id){
  const msg=document.getElementById('rateMsg');
  if(!pendingRating){ msg.innerHTML='<div class="notice n-amber" style="margin:0;padding:.5rem .7rem">กรุณาเลือกดาวก่อน</div>'; return; }
  if(!GAS_URL){ msg.innerHTML='<div class="notice n-red" style="margin:0;padding:.5rem .7rem">ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์</div>'; return; }
  const comment=(document.getElementById('rateComment').value||'').trim();
  const isProxy=!!document.getElementById('rateProxy')?.checked;
  const ratedBy=isProxy?(document.getElementById('rateProxyName').value||'').trim():'';
  if(isProxy && !ratedBy){ msg.innerHTML='<div class="notice n-amber" style="margin:0;padding:.5rem .7rem">กรุณาใส่ชื่อผู้ประเมินแทน</div>'; return; }
  showLoader('กำลังส่งคะแนน...');
  try{
    await api('rateTicket',{id,rating:pendingRating,comment,ratedBy});
    const t=DB.tickets.find(x=>x.id===id); if(t){ t.rating=pendingRating; t.ratingComment=comment; t.ratedBy=ratedBy;
      (t.history=t.history||[]).push({status:'done',date:now(),note:(ratedBy?'ประเมินแทนโดย '+ratedBy:'ผู้แจ้งประเมิน')+' — '+pendingRating+' ดาว',by:ratedBy||'ผู้แจ้ง'}); }
    hideLoader(); openDet(id); showToast('ขอบคุณสำหรับคะแนน '+pendingRating+' ดาว');
  }catch(e){ hideLoader(); msg.innerHTML='<div class="notice n-red" style="margin:0;padding:.5rem .7rem">ส่งไม่สำเร็จ: '+e.message+'</div>'; }
}

async function saveDueEdit(id, reset){
  const t=DB.tickets.find(x=>x.id===id); if(!t) return;
  const nd=reset?'':(document.getElementById('dueNew').value||'');
  const why=(document.getElementById('dueWhy').value||'').trim();
  const msg=document.getElementById('dueMsg');
  if(!reset && !nd){ msg.innerHTML='<div class="notice n-amber" style="margin:0 0 8px">กรุณาเลือกวันที่</div>'; return; }
  if(!why){ msg.innerHTML='<div class="notice n-amber" style="margin:0 0 8px">กรุณาใส่เหตุผล</div>'; return; }
  const old=dueDate(t);
  t.dueOverride=nd;
  const nw=dueDate(t);
  const entry={status:t.status,date:now(),by:cu.name,
    note:`📅 ${reset?'กลับไปใช้วันคาดว่าเสร็จตาม SLA':'เปลี่ยนวันคาดว่าเสร็จ'}: ${old?fdShort(old):'—'} → ${nw?fdShort(nw):'—'} — ${why}`};
  (t.history=t.history||[]).push(entry);
  await syncUpdate(id,{dueOverride:nd},entry);
  cm('dueMd'); openDet(id); rp(); showToast('บันทึกวันคาดว่าเสร็จแล้ว');
}

}

// กู้คืน session เดิม (ถ้ามี) — เซิร์ฟเวอร์จะปฏิเสธเองถ้า token หมดอายุ
// ─── ล้างข้อมูลเก่าครั้งเดียว เมื่อเปลี่ยนมาเป็นคณะการแพทย์แผนไทย ───
(function migrateData(){
  const DATA_VERSION='sahavej-2026';   // เปลี่ยนค่านี้เมื่อต้องการล้างแคชผู้ใช้ทุกคนอีกครั้ง
  if(localStorage.getItem('vr3_dataver')!==DATA_VERSION){
    // ล้างแคชข้อมูลเก่าทั้งหมด (อาคารเดิม/รายการซ่อม/รูป/ผู้ใช้)
    ['vr3_t','vr3_hist','vr3_cfg','vr3_photos','vr3_users','vr3_cache_at'].forEach(k=>localStorage.removeItem(k));
    localStorage.setItem('vr3_dataver',DATA_VERSION);
  }
})();

// ─── โหมดมืด/สว่าง ───
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  const btn=document.getElementById('themeBtn');
  if(btn) btn.textContent = t==='dark' ? '☀️' : '🌙';
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  const next=cur==='dark'?'light':'dark';
  localStorage.setItem('vr3_theme',next);
  applyTheme(next);
}
(function initTheme(){
  const saved=localStorage.getItem('vr3_theme');
  const prefers=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (prefers?'dark':'light'));
})();

(function restoreSession(){
  try{
    const t=localStorage.getItem('vr3_token'), u=localStorage.getItem('vr3_user');
    if(t&&u){ AUTH_TOKEN=t; cu=JSON.parse(u); }
  }catch{}
})();
updAuthUI();

// เลือกอาคาร/ชั้นจาก QR param หลังหน้า report พร้อม
let rateLinkDone=false, pageLinkDone=false, pendingPage=null;
const LINK_PAGES=['report','status','mine','qr','dashboard','mywork','approve','manage','pm','calendar'];
function applyQrParams(){
  const params=new URLSearchParams(window.location.search);
  // v15: ?page=report|status|mine|mywork|dashboard … (ใช้กับ Rich menu ของ LINE OA / ลิงก์ในอีเมล)
  const pg=params.get('page');
  if(!pageLinkDone){
    pageLinkDone=true;
    if(pg && LINK_PAGES.includes(pg)) { if(curPage!==pg) gp(pg); }
    else if(!pg && !params.get('id') && !params.get('rate') && !params.get('b') && cu && isMobile() && curPage==='report') gp('mywork');
  }
  // v12: ลิงก์ประเมินจากอีเมล ?rate=REP-xxx → เปิดใบนั้นพร้อมฟอร์มให้ดาว
  const oid=params.get('id');
  if(oid && !rateLinkDone && DB.tickets.find(t=>t.id===oid)){ rateLinkDone=true; setTimeout(()=>openDet(oid),60); }
  const rid=params.get('rate');
  if(rid && !rateLinkDone && DB.tickets.find(t=>t.id===rid)){
    rateLinkDone=true; gp('status'); setTimeout(()=>{ openDet(rid); const f=document.getElementById('rateForm'); if(f) f.scrollIntoView({behavior:'smooth',block:'center'}); },60);
  }
  const bParam=params.get('b'), fParam=params.get('f');
  if(bParam){ const el=document.getElementById('fB'); if(el){ el.value=bParam; updFloorOptions(fParam||undefined); } }
}

// เปิดเว็บ: ถ้ามีแคช แสดงทันที (instant) แล้วค่อยดึงใหม่เบื้องหลัง — ถ้าไม่มีแคชค่อยโหลดแบบปกติ
// เช็กเวอร์ชันเซิร์ฟเวอร์ (GET /exec) — ถ้าไม่ตรง แจ้งวิศวกรที่ป้ายเวอร์ชัน
async function checkServerVersion(){
  try{
    if(!GAS_URL) return;
    const r=await fetch(GAS_URL); const j=await r.json();
    SERVER_VERSION=(j&&j.data&&j.data.version)||'';
    const tag=document.getElementById('verTag');
    const bad=SERVER_VERSION&&SERVER_VERSION!==SERVER_REQUIRED;
    if(tag){ tag.textContent=APP_VERSION+(bad?' ⚠':''); if(bad) tag.style.background='rgba(227,91,91,.75)';
      tag.title=`หน้าเว็บ ${APP_VERSION} · เซิร์ฟเวอร์ ${SERVER_VERSION||'?'}${bad?' — ต้อง Deploy Code.gs '+SERVER_REQUIRED:''}`; }
  }catch(e){}
}
setTimeout(checkServerVersion,2500);
(function boot(){
  const cached=readCache();
  if(cached){
    applyBundle(cached);        // แสดงของเก่าทันที ไม่ต้องรอเซิร์ฟเวอร์
    rp(); applyQrParams();
    loadAll({silent:true}).then(()=>{ rp(); applyQrParams(); });  // อัปเดตเบื้องหลัง
  }else{
    loadAll().then(()=>{ rp(); applyQrParams(); });
  }
})();
updSyncBadge(); setTimeout(flushQ, 1500);   // มีงานค้างส่งจากครั้งก่อน → ส่งต่อให้อัตโนมัติ
// v15: PWA — ติดตั้งเป็นแอปบนมือถือได้ (ทำงานเฉพาะบน https เช่น GitHub Pages)
if('serviceWorker' in navigator && location.protocol==='https:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
